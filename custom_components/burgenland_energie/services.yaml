download_invoice:
  fields:
    bill_nr:
      required: false
      example: "000001789012"
      selector:
        text:
    all_missing:
      required: false
      default: false
      selector:
        boolean:
import_meter_data:
  fields:
    days:
      required: false
      default: 45
      selector:
        number:
          min: 1
          max: 2000
          mode: box
import_fanclub_invoices:
  fields:
    imap_entry:
      required: true
      selector:
        config_entry:
          integration: imap
    uid:
      required: true
      example: "1-9"
      selector:
        text:
